# Builds the firmware and publishes the site (emulator, installer, rescue) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions. Tags (v0.2) also get a release with the .fwsc.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - name: where it crashed (symbols around reported addresses)
        run: |
          ls build/fm1 | head -20
          D=build/fm1/firmware.dis
          grep -E '^[0-9a-f]+ <[^>]+>:' $D | sort > build/syms.txt || true
          wc -l build/syms.txt
          for a in 0200464c 02004b30 02004630; do echo "== $a"; awk -v A=$a '$1 <= A' build/syms.txt | tail -2; done
          grep -n -E '^ *0?200464c:' $D | head -3
          L=$(grep -n -E '^ *0?200464c:' $D | head -1 | cut -d: -f1); [ -n "$L" ] && sed -n "$((L-40)),$((L+8))p" $D
      - uses: actions/upload-artifact@v4
        with:
          name: be-here-now-fwsc
          path: build/*.fwsc
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
